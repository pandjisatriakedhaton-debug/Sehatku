<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SehatKu</title>

  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e8f5e9 0%, #ffffff 100%);
      padding: 20px;
    }

    /* ===== CARD ===== */
    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 10px 40px rgba(46, 125, 50, 0.12);
      animation: fadeUp 0.6s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== LOGO ===== */
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2e7d32, #66bb6a);
      border-radius: 18px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #fff;
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.25);
    }

    h1 {
      font-size: 24px;
      color: #1b5e20;
      text-align: center;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      color: #757575;
      font-size: 14px;
      margin-bottom: 30px;
    }

    /* ===== FORM ===== */
    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      font-size: 13px;
      color: #2e7d32;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
      background: #fafafa;
    }

    input:focus {
      border-color: #2e7d32;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
    }

    /* ===== OPSI ===== */
    .opsi {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .opsi label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #555;
      font-weight: 400;
      margin: 0;
      cursor: pointer;
    }

    .opsi input[type="checkbox"] {
      width: auto;
      accent-color: #2e7d32;
    }

    .opsi a {
      color: #2e7d32;
      text-decoration: none;
      font-weight: 600;
    }

    .opsi a:hover { text-decoration: underline; }

    /* ===== BUTTON ===== */
    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(46, 125, 50, 0.4);
    }

    .btn-login:active { transform: translateY(0); }

    /* ===== DIVIDER ===== */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #9e9e9e;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    /* ===== GOOGLE BUTTON ===== */
    .btn-google {
      width: 100%;
      padding: 14px;
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #444;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .btn-google:hover {
      border-color: #2e7d32;
      background: #f1f8e9;
    }

    .btn-google img { width: 20px; height: 20px; }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 14px;
      color: #757575;
    }

    .footer a {
      color: #2e7d32;
      font-weight: 600;
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <!-- LOGO -->
    <div class="logo">🌿</div>

    <h1>Selamat Datang</h1>
    <p class="subtitle">Masuk untuk mulai hidup sehat</p>

    <!-- FORM LOGIN -->
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <div class="opsi">
        <label>
          <input type="checkbox" id="remember" />
          Ingat saya
        </label>
        <a href="forgot.html">Lupa password?</a>
      </div>

      <button type="submit" class="btn-login">Masuk</button>
    </form>

    <!-- DIVIDER -->
    <div class="divider">atau</div>

    <!-- LOGIN GOOGLE -->
    <button class="btn-google" id="googleBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
      Masuk dengan Google
    </button>

    <!-- FOOTER -->
    <div class="footer">
      Belum punya akun? <a href="register.html">Daftar sekarang</a>
    </div>
  </div>

  <script>
    // ===== LOGIN FORM (dummy dulu) =====
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert('Email dan password wajib diisi!');
        return;
      }

      // Simpan session sementara (nanti ganti Firebase)
      localStorage.setItem('user', JSON.stringify({ email }));
      alert('Login berhasil! Selamat datang 🌿');

      // Arahkan ke home
      window.location.href = 'home.html';
    });

    // ===== LOGIN GOOGLE (placeholder) =====
    document.getElementById('googleBtn').addEventListener('click', function() {
      alert('Login Google akan diaktifkan setelah Firebase disetup.');
      // Nanti: signInWithPopup(auth, provider)
    });
  </script>

</body>
</html>
