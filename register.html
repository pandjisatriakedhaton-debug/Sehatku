<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — SehatKu</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body { min-height:100vh; display:flex; justify-content:center; align-items:center;
      background:linear-gradient(135deg,#e8f5e9 0%,#ffffff 100%); padding:20px; }
    .card { width:100%; max-width:400px; background:#fff; border-radius:24px;
      padding:40px 30px; box-shadow:0 10px 40px rgba(46,125,50,0.12); animation:fadeUp 0.6s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    .logo { width:64px; height:64px; background:linear-gradient(135deg,#2e7d32,#66bb6a);
      border-radius:18px; margin:0 auto 20px; display:flex; align-items:center;
      justify-content:center; font-size:32px; color:#fff; box-shadow:0 8px 20px rgba(46,125,50,0.25); }
    h1 { font-size:24px; color:#1b5e20; text-align:center; margin-bottom:8px; }
    .subtitle { text-align:center; color:#757575; font-size:14px; margin-bottom:30px; }
    .form-group { margin-bottom:18px; }
    label { display:block; font-size:13px; color:#2e7d32; margin-bottom:6px; font-weight:600; }
    input { width:100%; padding:14px 16px; border:1.5px solid #e0e0e0; border-radius:12px;
      font-size:15px; outline:none; transition:0.25s; background:#fafafa; }
    input:focus { border-color:#2e7d32; background:#fff; box-shadow:0 0 0 4px rgba(46,125,50,0.1); }
    .btn { width:100%; padding:15px; background:linear-gradient(135deg,#2e7d32,#43a047);
      color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:600;
      cursor:pointer; transition:0.25s; box-shadow:0 6px 16px rgba(46,125,50,0.3); margin-top:10px; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(46,125,50,0.4); }
    .btn-google { width:100%; padding:14px; background:#fff; border:1.5px solid #e0e0e0;
      border-radius:12px; font-size:15px; font-weight:500; color:#444; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:10px; transition:0.25s; margin-top:16px; }
    .btn-google:hover { border-color:#2e7d32; background:#f1f8e9; }
    .btn-google img { width:20px; height:20px; }
    .divider { display:flex; align-items:center; gap:12px; margin:24px 0; color:#9e9e9e; font-size:13px; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#e0e0e0; }
    .footer { text-align:center; margin-top:28px; font-size:14px; color:#757575; }
    .footer a { color:#2e7d32; font-weight:600; text-decoration:none; }
    .error { color:#d32f2f; font-size:13px; text-align:center; margin-top:12px; display:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌿</div>
    <h1>Buat Akun</h1>
    <p class="subtitle">Mulai perjalanan sehatmu hari ini</p>

    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="nama" placeholder="Nama kamu" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="nama@email.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Minimal 6 karakter" />
    </div>
    <div class="form-group">
      <label>Konfirmasi Password</label>
      <input type="password" id="konfirmasi" placeholder="Ulangi password" />
    </div>

    <button class="btn" id="btnDaftar">Daftar</button>
    <p class="error" id="errorMsg"></p>

    <div class="divider">atau</div>

    <button class="btn-google" id="googleDaftar">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
      Daftar dengan Google
    </button>

    <div class="footer">
      Sudah punya akun? <a href="login.html">Masuk</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, updateProfile }
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "ISI_API_KEY_KAMU",
      authDomain: "sehatku.firebaseapp.com",
      projectId: "sehatku",
      storageBucket: "sehatku.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const errorMsg = document.getElementById('errorMsg');
    function tampilError(pesan) { errorMsg.textContent = pesan; errorMsg.style.display = 'block'; }

    // Daftar Email/Password
    document.getElementById('btnDaftar').addEventListener('click', async () => {
      const nama = document.getElementById('nama').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const konfirmasi = document.getElementById('konfirmasi').value;

      if (!nama || !email || !password) return tampilError('Semua field wajib diisi!');
      if (password.length < 6) return tampilError('Password minimal 6 karakter.');
      if (password !== konfirmasi) return tampilError('Konfirmasi password tidak cocok.');

      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCred.user, { displayName: nama });
        alert('Akun berhasil dibuat! 🌿');
        window.location.href = 'home.html';
      } catch (err) {
        if (err.code === 'auth/email-already-in-use') tampilError('Email sudah terdaftar.');
        else if (err.code === 'auth/invalid-email') tampilError('Format email tidak valid.');
        else tampilError('Gagal daftar: ' + err.message);
      }
    });

    // Daftar via Google
    document.getElementById('googleDaftar').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
        window.location.href = 'home.html';
      } catch (err) { tampilError('Gagal daftar Google: ' + err.message); }
    });
  </script>
</body>
</html>
