<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Password — SehatKu</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body { min-height:100vh; display:flex; justify-content:center; align-items:center;
      background:linear-gradient(135deg,#e8f5e9 0%,#ffffff 100%); padding:20px; }
    .card { width:100%; max-width:400px; background:#fff; border-radius:24px;
      padding:40px 30px; box-shadow:0 10px 40px rgba(46,125,50,0.12); animation:fadeUp 0.6s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    .logo { width:64px; height:64px; background:linear-gradient(135deg,#2e7d32,#66bb6a);
      border-radius:18px; margin:0 auto 20px; display:flex; align-items:center;
      justify-content:center; font-size:32px; color:#fff; box-shadow:0 8px 20px rgba(46,125,50,0.25); }
    h1 { font-size:24px; color:#1b5e20; text-align:center; margin-bottom:8px; }
    .subtitle { text-align:center; color:#757575; font-size:14px; margin-bottom:30px; }
    .form-group { margin-bottom:18px; }
    label { display:block; font-size:13px; color:#2e7d32; margin-bottom:6px; font-weight:600; }
    input { width:100%; padding:14px 16px; border:1.5px solid #e0e0e0; border-radius:12px;
      font-size:15px; outline:none; transition:0.25s; background:#fafafa; }
    input:focus { border-color:#2e7d32; background:#fff; box-shadow:0 0 0 4px rgba(46,125,50,0.1); }
    .btn { width:100%; padding:15px; background:linear-gradient(135deg,#2e7d32,#43a047);
      color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:600;
      cursor:pointer; transition:0.25s; box-shadow:0 6px 16px rgba(46,125,50,0.3); margin-top:10px; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(46,125,50,0.4); }
    .footer { text-align:center; margin-top:28px; font-size:14px; color:#757575; }
    .footer a { color:#2e7d32; font-weight:600; text-decoration:none; }
    .pesan { font-size:13px; text-align:center; margin-top:14px; display:none; }
    .sukses { color:#2e7d32; }
    .gagal { color:#d32f2f; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔐</div>
    <h1>Lupa Password?</h1>
    <p class="subtitle">Masukkan email untuk menerima link reset</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="nama@email.com" />
    </div>

    <button class="btn" id="btnKirim">Kirim Link Reset</button>
    <p class="pesan" id="pesan"></p>

    <div class="footer">
      Ingat password? <a href="login.html">Kembali ke Login</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "ISI_API_KEY_KAMU",
      authDomain: "sehatku.firebaseapp.com",
      projectId: "sehatku",
      storageBucket: "sehatku.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const pesan = document.getElementById('pesan');

    document.getElementById('btnKirim').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) return alert('Masukkan email kamu dulu ya!');

      try {
        await sendPasswordResetEmail(auth, email);
        pesan.textContent = '✅ Link reset sudah dikirim ke email kamu.';
        pesan.className = 'pesan sukses';
        pesan.style.display = 'block';
      } catch (err) {
        pesan.textContent = '❌ Gagal: ' + err.message;
        pesan.className = 'pesan gagal';
        pesan.style.display = 'block';
      }
    });
  </script>
</body>
</html>
