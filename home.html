<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beranda — SehatKu</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body { min-height:100vh; background:linear-gradient(135deg,#e8f5e9 0%,#ffffff 100%); padding:20px; }
    .container { max-width:500px; margin:0 auto; }

    .header { display:flex; justify-content:space-between; align-items:center;
      padding:16px 0 24px; }
    .header h1 { font-size:20px; color:#1b5e20; }
    .header h1 span { color:#43a047; }
    .btn-logout { background:#fff; border:1.5px solid #e0e0e0; padding:8px 16px;
      border-radius:10px; font-size:13px; color:#666; cursor:pointer; transition:0.2s; }
    .btn-logout:hover { border-color:#d32f2f; color:#d32f2f; background:#ffebee; }

    .greet { background:linear-gradient(135deg,#2e7d32,#43a047); color:#fff;
      border-radius:20px; padding:24px; margin-bottom:24px;
      box-shadow:0 10px 30px rgba(46,125,50,0.25); }
    .greet p { font-size:14px; opacity:0.9; }
    .greet h2 { font-size:22px; margin-top:4px; }

    .section-title { font-size:16px; color:#1b5e20; margin-bottom:14px; font-weight:700; }

    .menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:24px; }
    .menu-card { background:#fff; border-radius:18px; padding:22px 16px; text-align:center;
      cursor:pointer; transition:0.25s; box-shadow:0 4px 16px rgba(46,125,50,0.08);
      border:1.5px solid transparent; }
    .menu-card:hover { transform:translateY(-4px); box-shadow:0 10px 26px rgba(46,125,50,0.18);
      border-color:#c8e6c9; }
    .menu-card .icon { font-size:36px; margin-bottom:10px; }
    .menu-card h3 { font-size:14px; color:#1b5e20; margin-bottom:4px; }
    .menu-card p { font-size:11px; color:#888; }

    .footer { text-align:center; padding:20px 0; font-size:12px; color:#aaa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌿 <span>SehatKu</span></h1>
      <button class="btn-logout" id="btnLogout">Keluar</button>
    </div>

    <div class="greet">
      <p>Selamat datang,</p>
      <h2 id="namaUser">Pengguna</h2>
    </div>

    <p class="section-title">Pilih Kategori Perawatan</p>

    <div class="menu-grid">
      <div class="menu-card" onclick="location.href='luar/wajah.html'">
        <div class="icon">🧴</div>
        <h3>Perawatan Wajah</h3>
        <p>Facial wash, skincare</p>
      </div>
      <div class="menu-card" onclick="location.href='luar/kulit.html'">
        <div class="icon">✨</div>
        <h3>Kulit Tubuh</h3>
        <p>Losion, body care</p>
      </div>
      <div class="menu-card" onclick="location.href='dalam/berat-badan.html'">
        <div class="icon">🍎</div>
        <h3>Berat Badan</h3>
        <p>Naik / turun BB</p>
      </div>
      <div class="menu-card" onclick="location.href='dalam/otot.html'">
        <div class="icon">💪</div>
        <h3>Bentuk Otot</h3>
        <p>Latihan gym & alat</p>
      </div>
    </div>

    <div class="footer">© 2026 SehatKu — Hidup sehat dari dalam & luar</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "ISI_API_KEY_KAMU",
      authDomain: "sehatku.firebaseapp.com",
      projectId: "sehatku",
      storageBucket: "sehatku.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Cek status login — kalau belum login, tendang ke login.html
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const nama = user.displayName || user.email.split('@')[0];
        document.getElementById('namaUser').textContent = nama;
      } else {
        window.location.href = 'login.html';
      }
    });

    // Logout
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
